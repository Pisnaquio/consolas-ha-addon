<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Catálogo de Consolas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20261110a" />
    <link rel="stylesheet" href="./studio-theme.css?v=20261110a" />
    <link rel="stylesheet" href="./estante-shell.css?v=20261111b" />
  </head>
  <body class="studio-variant">
    <div class="bg-pattern" aria-hidden="true"></div>
    <main class="container">
      <header class="hero">
        <h1>Mi colección</h1>
        <p class="subtitle">
          Consolas y juegos que tengo y que busco, con su estado y su precio de referencia.
          <a href="./collection-control.html">Ver tengo / quiero por generación</a>
        </p>
      </header>

      <section class="summary shelf-summary" id="summary" aria-label="Resumen de la colección"></section>

      <section class="controls shelf-controls">
        <div class="search-wrap">
          <label for="search">Buscar</label>
          <input id="search" type="search" placeholder="Nombre, notas, accesorios o juegos..." />
        </div>
        <div class="filters">
          <div>
            <label for="quickFilter">Vista rápida</label>
            <select id="quickFilter">
              <option value="all">Todas</option>
              <option value="have">Tengo</option>
              <option value="want">No tengo</option>
            </select>
          </div>
        </div>
        <details class="advanced-filters">
          <summary>Más filtros</summary>
          <div class="filters">
          <div id="noHaveSubFilterWrap" hidden>
            <label for="noHaveSubFilter">Subfiltro (No tengo)</label>
            <select id="noHaveSubFilter">
              <option value="">Todas</option>
              <option value="wishlist">Wishlist</option>
            </select>
          </div>
          <div>
            <label for="brandFilter">Marca</label>
            <select id="brandFilter">
              <option value="">Todas</option>
            </select>
          </div>
          <div>
            <label for="generationFilter">Generación</label>
            <select id="generationFilter">
              <option value="">Todas</option>
            </select>
          </div>
          <div>
            <label for="statusFilter">Estado</label>
            <select id="statusFilter">
              <option value="">Todos</option>
            </select>
          </div>
          <div>
            <label for="sortFilter">Orden</label>
            <select id="sortFilter">
              <option value="year-asc">Año (ascendente)</option>
              <option value="year-desc">Año (descendente)</option>
              <option value="name-asc">Nombre (A-Z)</option>
            </select>
          </div>
          <div>
            <label for="groupByFilter">Agrupar por</label>
            <select id="groupByFilter">
              <option value="none">Sin agrupar</option>
              <option value="brand">Fabricante</option>
              <option value="ownership">Tengo / No tengo</option>
            </select>
          </div>
        </div>
        </details>
      </section>

      <section>
        <div class="section-title-row">
          <h2>Registrados / ya tengo</h2>
          <span id="registeredCount" class="count"></span>
        </div>
        <div id="registeredGrid" class="grid shelf-grid"></div>
      </section>

      <section>
        <div class="section-title-row">
          <h2>Deseados / recomendados</h2>
          <span id="wishlistCount" class="count"></span>
        </div>
        <div id="wishlistGrid" class="grid shelf-grid"></div>
      </section>
    </main>

    <template id="consoleCardTemplate">
      <article class="card">
        <div class="card-media">
          <img loading="lazy" decoding="async" />
        </div>
        <div class="card-body">
          <div class="card-head">
            <h3></h3>
            <span class="badge"></span>
          </div>
          <p class="meta"></p>
          <p class="state"></p>
          <p class="card-status"></p>
          <div class="chips"></div>
          <p class="notes"></p>
          <div class="price-reference"></div>
          <div class="price-row"></div>
          <div class="card-foot">
            <span class="card-games"></span>
            <span class="card-price"></span>
          </div>
          <div class="card-actions">
            <a class="btn-link detail-link">Ver detalle</a>
          </div>
        </div>
      </article>
    </template>

    <script src="./ha-deep-link.js?v=20260930a"></script>
    <script src="./data-store.js?v=20260710b" defer></script>
    <script src="./collection-repository.js?v=20261016b" defer></script>
    <script src="./app.js?v=20261111b" defer></script>
    <script src="./studio-bridge.js?v=20260522a" defer></script>
    <script src="./site-nav.js?v=20261111b"></script>
  </body>
</html>
